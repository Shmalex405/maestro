# =============================================================================
# IDENTITY CREDENTIALS — auth for identity_targets (AD / Entra / M365 / Okta /
# Google Workspace / Ping). A map keyed by ref name; a scope.yml identity_target
# points at an entry via `sa_key_ref` (Google Workspace SA JSON) or
# `credential_ref` (tokens / service principals / domain creds).
#
# The desktop Config → Identity Targets page writes these for you (and stores
# Google SA-key JSON as a 0600 file under ~/.kali-mcp-pentest/identity/, with
# `path` pointing at its in-container path). Hand-edit only if you prefer YAML.
# =============================================================================
identity_credentials: {}
  # Google Workspace — service-account JSON (domain-wide delegation). `path` is
  # the in-container file path; the delegated admin lives on the scope entry.
  # gws-corp-sa:
  #   kind: sa_json
  #   path: "/mnt/host-home/.kali-mcp-pentest/identity/gws-corp-sa.json"

  # Okta — API token
  # okta-corp-cred:
  #   kind: okta_token
  #   value: "${OKTA_API_TOKEN}"

  # Entra ID / M365 — service principal
  # entra-corp-cred:
  #   kind: entra_sp
  #   tenant_id: "${ENTRA_TENANT_ID}"
  #   client_id: "${ENTRA_CLIENT_ID}"
  #   client_secret: "${ENTRA_CLIENT_SECRET}"

  # Active Directory — domain creds
  # ad-corp-cred:
  #   kind: domain_creds
  #   username: "${AD_USERNAME}"
  #   password: "${AD_PASSWORD}"
  #   domain: "corp.example.com"

# Default headers attached to every authenticated request
default_headers:
  User-Agent: "Maestro/1.0"
  Accept: "application/json"

# Test accounts by role (for authorization-boundary testing)
test_accounts:
  admin:
    username: "${TEST_ADMIN_USER}"
    password: "${TEST_ADMIN_PASS}"
    role: "administrator"

  user:
    username: "${TEST_USER_USER}"
    password: "${TEST_USER_PASS}"
    role: "standard_user"

  readonly:
    username: "${TEST_READONLY_USER}"
    password: "${TEST_READONLY_PASS}"
    role: "read_only"

# Credential rotation (off by default; enable per-engagement if needed)
rotation:
  enabled: false
  interval_hours: 24
