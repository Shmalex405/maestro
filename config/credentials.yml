# Credentials Configuration — TEMPLATE
#
# This file is the OFFLINE FALLBACK only. In production, the Maestro desktop
# app stores credentials per-user (secrets in the OS keychain) and per-org
# (shared metadata in the cloud backend). The in-container MCP server reads
# the merged config from a host-side JSON file the desktop materializes —
# you don't need to touch this YAML for normal use.
#
# When this YAML IS read:
#   1. CI / unattended runs without a desktop session
#   2. Local dev when the desktop hasn't materialized credentials yet
#
# Personal overrides go in `config/credentials.local.yml` (gitignored, picked
# up automatically by the loader). Never put real secrets in this committed
# file — it's public template, the kind of thing customers cloning the repo
# can read.
#
# All values use ${ENV_VAR} substitution; export the vars in your shell or
# a .env file before launching.

applications:
  # Generic web application using session-cookie auth
  - name: "main-webapp"
    environment: "staging"
    base_url: "https://app.staging.example.com"
    auth_type: "session"  # session | basic | bearer | api_key | oauth2 | otp_email
    credentials:
      username: "${WEBAPP_USERNAME}"
      password: "${WEBAPP_PASSWORD}"
    login_url: "/api/auth/login"
    login_method: "POST"
    login_body:
      email: "${WEBAPP_USERNAME}"
      password: "${WEBAPP_PASSWORD}"
    session_token_location: "cookie"  # cookie | header | body
    session_token_name: "session_id"

  # API protected by a Bearer token
  - name: "internal-api"
    environment: "staging"
    base_url: "https://api.staging.example.com"
    auth_type: "bearer"
    credentials:
      token: "${API_BEARER_TOKEN}"
    headers:
      Authorization: "Bearer ${API_BEARER_TOKEN}"

  # API protected by a custom-header API key
  - name: "partner-api"
    environment: "test"
    base_url: "https://partner-api.test.example.com"
    auth_type: "api_key"
    credentials:
      api_key: "${PARTNER_API_KEY}"
    headers:
      X-API-Key: "${PARTNER_API_KEY}"

  # Basic-auth admin panel
  - name: "admin-panel"
    environment: "staging"
    base_url: "https://admin.staging.example.com"
    auth_type: "basic"
    # role: intended privilege of this identity, used to calibrate access-control
    # findings (admin | privileged | standard | readonly). An expected-for-role
    # capability is recorded but downgraded; the same capability reached by a
    # LOWER role stays a real finding. Omit ⇒ unknown ⇒ no downgrade (fail-safe).
    role: "admin"
    credentials:
      username: "${ADMIN_USERNAME}"
      password: "${ADMIN_PASSWORD}"

  # OAuth2 client-credentials flow
  - name: "oauth-app"
    environment: "staging"
    base_url: "https://oauth-app.staging.example.com"
    auth_type: "oauth2"
    oauth2:
      token_url: "https://auth.example.com/oauth/token"
      client_id: "${OAUTH_CLIENT_ID}"
      client_secret: "${OAUTH_CLIENT_SECRET}"
      scope: "read write"
      grant_type: "client_credentials"

  # OTP/email-based authentication (interactive — Maestro prompts you for the code)
  - name: "otp-app"
    environment: "staging"
    base_url: "https://secure-app.staging.example.com"
    auth_type: "otp_email"
    interactive: true
    otp_config:
      # Step 1: send the OTP
      initiate_url: "/auth/login"
      initiate_method: "POST"
      initiate_body:
        email: "${OTP_APP_USERNAME}"
      username_field: "email"
      username_value: "${OTP_APP_USERNAME}"
      # Step 2: submit the OTP
      verify_url: "/auth/verify-otp"
      verify_method: "POST"
      verify_body:
        email: "${OTP_APP_USERNAME}"
        code: "{{OTP_CODE}}"  # Replaced with user input at runtime
      session_token_location: "cookie"  # cookie | header | body
      session_token_name: "session_id"
      otp_timeout: 300  # seconds to wait for user

