# Verification rules
verification:
  # `matrix_total` is the full size of config/test-matrix.yml (every test ever defined).
  # The number the lead actually verifies against is the SCOPE-DERIVED in-scope count,
  # computed at runtime from each test's `applies_when` gate vs the active scope — NOT a
  # fixed number. Never hardcode the per-run denominator anywhere; it changes with scope
  # (cloud_accounts, identity provider targets, kubernetes clusters, repo_paths) and grows
  # as the matrix gains tests. See in_scope_rule below and skills/team-assessment/SKILL.md.
  matrix_total: 232  # full matrix: 73 DAST + 24 SAST + 15 XVAL + 8 CHAIN + 29 CLOUD + 60 IDENTITY + 23 AI (informational only)
  in_scope_count: "derive at runtime from test-matrix applies_when vs scope — do not hardcode"
  in_scope_rule: >
    A test is in scope when (1) it has no applies_when (always-on base), or (2) its
    applies_when names a configured scope dimension (cloud_accounts / an identity provider
    target / ai_targets (+ kind gates — a kind counts in-scope when DECLARED or DETECTED
    by AI-RECON-05) / kubernetes / repo_paths), or (3) it is a surface-discovery gate
    (status N_A when the surface is absent, but still in scope).
    Tests gated on an unconfigured scope dimension are out of scope: report them in an
    "Out of Scope (N_A)" appendix, excluded from the active denominator.
  total_agents: 22  # 1 lead + 21 workers (cloud + identity + ai agents conditional on scope)
  status_values: ["PASS", "FAIL", "N_A", "BLOCKED"]
  banned_statuses: ["SKIPPED"]
  lead_must_verify_before_report: true
  lead_passes_to_report: ["IN_SCOPE_TEST_IDS", "IN_SCOPE_TEST_COUNT"]  # the scope-derived set + count
  missing_test_recovery: "Lead runs missing tests directly or re-spawns agent"
