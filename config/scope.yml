# Scope Configuration — TEMPLATE
#
# This file is the OFFLINE FALLBACK only. In production, the Maestro desktop
# app stores scope per-org in the cloud backend; the in-container MCP server
# fetches it via the cloud-session bridge. You don't need to edit this YAML
# for normal use — open the desktop app's Scope page instead.
#
# When this YAML IS read:
#   1. CI / unattended runs without a desktop session
#   2. Local dev when no scope has been saved to the cloud yet
#
# Personal overrides go in `config/scope.local.yml` (gitignored, picked up
# automatically by the loader). Never put real customer domains in this
# committed file — it's a public template.

# Apps group related domains/networks into logical applications.
# Add your own under `config/scope.local.yml` rather than here.
apps: []

# Legacy flat lists kept for backwards compatibility with the MCP scope
# validator. Anything that should be testable goes under one of these.

networks:
  - cidr: "10.0.0.0/8"
    environment: "internal-dev"
    notes: "Internal RFC1918 example — replace with your authorized ranges"

  - cidr: "192.168.100.0/24"
    environment: "staging"
    notes: "Staging example"

domains:
  - pattern: "*.dev.example.com"
    environment: "development"

  - pattern: "*.staging.example.com"
    environment: "staging"

  - pattern: "api-test.example.com"
    environment: "test"

# =============================================================================
# CLOUD ACCOUNTS — Authorized cloud infrastructure for red team testing
# =============================================================================
# Each entry authorizes testing of a specific cloud account/subscription/project.
# Cloud tools validate against these entries before executing.
# Auth is resolved at runtime: role assumption, profile, or env vars.

cloud_accounts:
  # Example AWS account (uncomment and configure for your environment)
  # - id: "aws-staging"
  #   provider: aws
  #   account_id: "123456789012"
  #   regions:
  #     - "us-east-1"
  #     - "us-west-2"
  #   auth_method: "role"           # role | access_key | profile
  #   role_arn: "arn:aws:iam::123456789012:role/MaestroPentestRole"
  #   services_in_scope:
  #     - "ec2"
  #     - "s3"
  #     - "lambda"
  #     - "rds"
  #     - "ecs"
  #     - "eks"
  #     - "iam"
  #     - "secretsmanager"
  #     - "sqs"
  #     - "sns"
  #   exclusions:
  #     - "arn:aws:s3:::production-*"
  #     - "arn:aws:ec2:*:*:instance/i-prod*"
  #     - "arn:aws:lambda:*:*:function:prod-*"
  #   notes: "Staging AWS account — authorized for full red team"

  # Example Azure subscription
  # - id: "azure-dev"
  #   provider: azure
  #   subscription_id: "${AZURE_SUBSCRIPTION_ID}"
  #   tenant_id: "${AZURE_TENANT_ID}"
  #   auth_method: "service_principal"  # service_principal | managed_identity | cli
  #   client_id: "${AZURE_CLIENT_ID}"
