name: Desktop E2E

# WebdriverIO + tauri-driver suite that drives the real Tauri desktop
# binary. Catches frontend ↔ Tauri command ↔ backend regressions that the
# in-process tests (vitest/jest/cargo test) can't reach because they
# don't render or click the real UI.
#
# Linux-only — tauri-driver upstream is Linux/Windows. See
# tests-e2e-desktop/README.md for the full setup story.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - 'tests-e2e-desktop/**'
      - '.github/workflows/desktop-e2e.yml'

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-e2e:
    name: desktop e2e (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAESTRO_TEST_BYPASS_AUTH: "1"
      MAESTRO_BINARY_PATH: ${{ github.workspace }}/frontend/src-tauri/target/debug/Maestro
      TAURI_DRIVER_HOST: 127.0.0.1
      TAURI_DRIVER_PORT: "4444"
      DISPLAY: ":99"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Tauri Linux deps + WebKit driver + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev javascriptcoregtk-4.1 \
            webkit2gtk-driver xvfb

      - name: Cache cargo (tauri shell)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: tauri-e2e-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-e2e-${{ runner.os }}-

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build mcp-server (needed by bundler resource glob)
        working-directory: mcp-server
        run: |
          npm ci
          npm run build

      - name: Stub tmux sidecar binary
        # tauri.conf.json:bundle.externalBin requires this file to exist
        # at build time. The e2e suite never spawns tmux, so an empty file
        # is fine.
        working-directory: frontend/src-tauri
        run: |
          mkdir -p binaries
          touch binaries/tmux-x86_64-unknown-linux-gnu
          chmod +x binaries/tmux-x86_64-unknown-linux-gnu

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Tauri (debug)
        working-directory: frontend
        run: npm run tauri:build -- --debug --no-bundle
        env:
          # Tauri picks the binary name from productName; the result is
          # `target/debug/Maestro` which MAESTRO_BINARY_PATH points at.
          RUST_BACKTRACE: "1"

      - name: Install e2e suite deps
        working-directory: tests-e2e-desktop
        run: npm install --no-frozen-lockfile

      - name: Start tauri-driver under Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          tauri-driver --port 4444 &
          # Wait for tauri-driver to accept connections.
          for i in $(seq 1 30); do
            if curl -fsSo /dev/null "http://127.0.0.1:4444/status"; then
              echo "tauri-driver up"
              exit 0
            fi
            sleep 1
          done
          echo "tauri-driver did not come up within 30s" >&2
          exit 1

      - name: Run WebdriverIO suite
        working-directory: tests-e2e-desktop
        run: npm test

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-screenshots
          path: tests-e2e-desktop/screenshots/
          if-no-files-found: ignore
          retention-days: 7
