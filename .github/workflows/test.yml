name: Test

# Runs the test suite for every push + every PR. Each layer
# (backend-rs, frontend, tauri shell, mcp-server) runs in its
# own job so failures land in clearly-labeled status checks.
#
# Tauri E2E (WebdriverIO + tauri-driver) lives in a separate workflow —
# see desktop-e2e.yml. It runs on Linux only because tauri-driver is
# Linux/Windows-only upstream; macOS devs run the in-process suite +
# manual checklist locally.
#
# What's NOT covered yet:
#   - The release build pipeline (covered by release-desktop.yml's
#     real builds — those serve as smoke tests)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # license-boundary — the open-core carve-out must stay intact
  #
  # Cheap and fails fast. A renamed directory that drops off
  # COMMERCIAL-COMPONENTS is a path that silently became Apache-2.0, which is
  # not something we want to discover after publishing.
  # ───────────────────────────────────────────────────────────────────────────
  license-boundary:
    name: license-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check open-core license boundary
        run: ./scripts/check-license-boundary.sh

  # ───────────────────────────────────────────────────────────────────────────
  # secret-scan — no new credentials reach a commit
  #
  # Scans the CHECKED-OUT TREE, not history. That is deliberate: this repo's
  # history contains real credentials and customer assessment reports (see the
  # pre-publication cleanup), so a history scan would fail on every run and get
  # muted — which is worse than no scan. Tree mode fails only on something newly
  # introduced, which is the thing CI can actually prevent.
  #
  # Because actions/checkout materializes only tracked files, gitignored working
  # data (reports/, competitive-intel/, .nodegoat/) is absent here and needs no
  # allowlisting to pass.
  #
  # Reviewed non-secrets live in .gitleaksignore, keyed by file:rule:line so a
  # moved line comes back for re-review rather than staying muted.
  # ───────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (working tree)
        run: |
          docker run --rm -w /repo -v "$PWD:/repo" \
            zricethezav/gitleaks:latest dir . \
            --config=.gitleaks.toml \
            --redact \
            --verbose

  # ───────────────────────────────────────────────────────────────────────────
  # backend-rs — integration tests against an ephemeral postgres
  # ───────────────────────────────────────────────────────────────────────────
  backend-rs:
    name: backend-rs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5433:5432"
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres
      # Tests don't actually hit AWS; provide dummy values so config
      # loading code that reads these env vars doesn't panic.
      JWT_SECRET: test-secret-do-not-use-in-prod
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend-rs/target
          key: backend-rs-${{ runner.os }}-${{ hashFiles('backend-rs/Cargo.lock') }}
          restore-keys: |
            backend-rs-${{ runner.os }}-

      - name: Run tests
        working-directory: backend-rs
        run: cargo test --no-fail-fast

  # ───────────────────────────────────────────────────────────────────────────
  # frontend — vitest (React Testing Library + jsdom)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npx vitest run --reporter=default

  # ───────────────────────────────────────────────────────────────────────────
  # tauri shell — cargo unit tests on the binary target
  # ───────────────────────────────────────────────────────────────────────────
  tauri:
    name: tauri (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev javascriptcoregtk-4.1

      - name: Stub tmux sidecar binary for the build script
        # tauri.conf.json:bundle.externalBin requires this file to exist
        # at build time even for tests. Production releases ship a real
        # tmux compiled per target; for unit tests we only need the
        # presence check to pass.
        working-directory: frontend/src-tauri
        run: |
          mkdir -p binaries
          for triple in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc.exe; do
            touch "binaries/tmux-${triple}"
          done

      - name: Stub mcp-server dist for the bundler resource glob
        # tauri.conf.json:bundle.resources globs ../../mcp-server/dist/**/*.
        # Production builds run `npm run build` in mcp-server first; for
        # unit tests we just need a placeholder so the glob isn't empty.
        run: |
          mkdir -p mcp-server/dist
          touch mcp-server/dist/.test-stub

      - name: Stub frontend export for tauri build.frontendDist check
        # tauri.conf.json:build.frontendDist points at ../out (the Next
        # static export). Production builds run `npm run build` first;
        # for unit tests we touch a placeholder so the path-exists
        # check passes.
        run: |
          mkdir -p frontend/out
          touch frontend/out/.test-stub

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-${{ runner.os }}-

      - name: Run Tauri unit tests
        working-directory: frontend/src-tauri
        run: cargo test --bin Maestro --no-fail-fast

  # ───────────────────────────────────────────────────────────────────────────
  # mcp-server — vitest
  # All 6 existing test files are pre-broken (module path drift since
  # last edit). Skipped in CI until rewritten — track in TESTING.md.
  # mcp-server:
  #   name: mcp-server
  #   runs-on: ubuntu-latest
  #   …

